[package]
name = "exchange-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "exchange-data"
path = "src/main.rs"

[features]
default = ["web"]
web = [
    "dioxus/web",
    "dep:gloo-net",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
desktop = [
    "dioxus/desktop",
    "dep:cryptool",
    "dep:directories",
    "dep:tokio",
]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = [
    "asset",
    "document",
    "hooks",
    "html",
    "launch",
    "macro",
    "router",
    "signals",
] }
exchange-types = { path = "../../crates/exchange-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] , optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Document", "Element", "History", "Location", "Storage", "Window"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), any(target_os = "macos", target_os = "windows")))'.dependencies]
cryptool = { path = "../..", optional = true }
directories = { version = "6", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"], optional = true }

[dev-dependencies]
pretty_assertions = "1"
